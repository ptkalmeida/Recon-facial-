# ==========================================
# Face Recognition Pro 3.0 - Configuration
# ==========================================
# WARNING: Do NOT store secrets in this file!
# All sensitive values must be set in .env file
# See .env.example for reference
#
# ==========================================
# PRECEDENCIA DE CONFIGURACAO
# ==========================================
#   variavel de ambiente  >  .env  >  ESTE ARQUIVO  >  default do codigo
#
# Ou seja: o que esta aqui vale de verdade, mas o ambiente sobrepoe. Use este
# arquivo para a configuracao versionada da instalacao e o .env para segredos e
# ajustes por maquina.
#
# Nem toda chave e lida: app/config.py mantem um mapeamento explicito
# (YAML_TO_FIELD) do formato aninhado daqui para os campos planos de `Settings`.
# Chave nao mapeada aparece em `YamlConfigSource.chaves_desconhecidas` em vez de
# ser ignorada em silencio.
#
# Ate a versao anterior este arquivo era decorativo - o YAML era carregado e nunca
# usado, e `threshold: 0.3` convivia com o valor real 0.4.

app_name: "Face Recognition Pro 3.0"
version: "3.0.0"

server:
  host: "0.0.0.0"
  port: 8001
  reload: false

database:
  type: "sqlite"
  # Path is relative to project root
  path: "data/face_recognition.db"
  echo: false

face_recognition:
  # Model options: Facenet, Facenet512, OpenFace, DeepID, ArcFace, Dlib, SFace
  model: "Facenet512"
  # Detector options: retinaface, mtcnn, opencv, ssd, dlib
  detector: "retinaface"
  distance_metric: "cosine"
  # Distancia maxima de cosseno para considerar a mesma pessoa.
  # Validado com fotos reais no backend insightface/buffalo_l: mesma pessoa em
  # fotos diferentes deu 0.18; pessoas diferentes, 0.86 e 0.90. 0.4 fica no meio
  # com margem dos dois lados.
  threshold: 0.4
  enforce_detection: true
  detector_threshold: 0.7
  # Image normalization
  normalization: "base"  # base, raw, Facenet
  # Face alignment
  align: true
  # Logging cooldown to avoid repeated logs for the same person (seconds)
  log_cooldown_seconds: 5
  # Multi-frame confirmation window (seconds)
  confirmation_window_seconds: 2.5
  # Minimum recognized frames in the window before logging access
  confirmation_min_frames: 3
  # Nitidez minima (variancia do Laplaciano) para aceitar um rosto. 100 recusava
  # captura de webcam utilizavel; 40 foi calibrado com fotos reais.
  min_sharpness: 40
  # Fallback de 'embedding' por histograma: NAO identifica pessoa. Manter false.
  allow_insecure_hog_embeddings: false

# Porta fisica (controle de acesso)
door:
  # Confianca minima do match para acionar a porta.
  min_confidence: 0.8
  # Exige sinal de vivacidade junto da confianca. Antes o campo is_live era
  # calculado e ignorado, e a porta abria so por confianca - uma foto impressa
  # com match confiante abria a porta.
  require_liveness: true

anti_spoofing:
  enabled: true
  blink_detection: true
  min_blinks: 2
  blink_timeout: 3
  liveness_check: true

video:
  default_source: 0
  fps_limit: 30
  frame_skip: 2
  resolution:
    width: 1280
    height: 720

presence:
  timeout_seconds: 60
  auto_checkout_enabled: true

logging:
  level: "INFO"
  log_file: "logs/face_recognition.log"
  max_size_mb: 10
  backup_count: 5

export:
  reports_dir: "data/reports"
  formats: ["xlsx", "pdf"]

cameras:
  enabled: false
  sources: []
  rtsp_enabled: false

# Security settings (non-sensitive only)
security:
  jwt_algorithm: "HS256"
  access_token_expire_minutes: 60
  # Rate limiting
  rate_limit_max_requests: 100
  rate_limit_window_seconds: 60
  auth_max_attempts: 5
  auth_block_duration: 900
  # IPs de proxies reversos confiaveis, separados por virgula. So desses
  # enderecos os cabecalhos X-Forwarded-For / X-Real-IP valem para identificar o
  # cliente; vazio significa usar sempre o IP real da conexao.
  trusted_proxies: ""
  # CORS - override with ALLOWED_ORIGINS env var
  cors_origins:
    - "http://localhost:8001"
    - "http://127.0.0.1:8001"
